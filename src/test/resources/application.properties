spring.application.name=librarymgnt-test

# Use in-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT settings
jwt.secret=libraryManagementSystemSecretKey2026SecureKeyWithSufficientEntropyAndLengthForHmacSha256
jwt.expiration=86400000

# Seed Admin Configuration for Tests
app.admin.username=testadmin
app.admin.password=Admin@123
app.admin.email=testadmin@library.com
app.admin.name=Test Administrator
