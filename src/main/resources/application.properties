
spring.application.name=librarymgnt
server.port=${PORT:8081}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Database Configuration with Environment Variable support and local defaults
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Default Admin Configuration (seed account for local development)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.email=${ADMIN_EMAIL:admin@library.com}
app.admin.name=${ADMIN_NAME:System Administrator}

# AI settings, key and model name come from environment variables
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:}
